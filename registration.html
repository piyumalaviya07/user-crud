<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <title>Registration Page</title>
</head>
<body>
    <div class="container">
        <form onsubmit="return validform()">
        <h1>Registration</h1>
            <div class="input">
                <label>UserName</label>
                <input type="text" id="username" placeholder="Enter Username">
                <p id="usernameError" class="error"></p>
            </div>
            <div class="input">
                <label>Email</label>
                <input type="text" id="email" placeholder="Enter Email">
                <p id="emailError" class="error"></p>
            </div>
            <div class="input">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••">
                <p id="passwordError" class="error"></p>
            </div>
            <div class="input">
                <label>Confirm Password</label>
                <input type="password" id="cpassword" placeholder="••••••">
                <p id="cpasswordError" class="error"></p>
            </div>
            <button type="submit">REGISTER</button>
            <div class="footer">
                Already have an Account? <a href="login.html"> Login</a> 
            </div>
        </form>
    </div>
    <script>
        function validform(){
            let username = document.getElementById("username").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let cpassword = document.getElementById("cpassword").value;

            let usernameError = document.getElementById("usernameError");
            let emailError = document.getElementById("emailError");
            let passwordError = document.getElementById("passwordError");
            let cpasswordError = document.getElementById("cpasswordError");

            let valid=true;
            usernameError.textContent="";
            emailError.textContent="";
            passwordError.textContent="";
            cpasswordError.textContent="";

            if(username===""){
            usernameError.textContent="Username is Required!";
            valid=false;
            }

            if(email===""){
                emailError.textContent="Email is Required!";
                valid=false;
            }else if(!email.includes("@")){
                emailError.textContent="Email must contain @ symbol!";
                valid=false;
            }

            if(password===""){
                passwordError.textContent="Password is Required!";
                valid=false;
            }
            else if(password.length<6){
                passwordError.textContent="Password must be required 6 characters!";
                valid=false;
            }

            if(cpassword !=password){
                cpasswordError.textContent="Password do not match!";
                valid=false;
            }
            if(valid){
                // window.location.href = "webpage.html";
                clearForm();
            }
            return false;
        }
         function clearForm(){
            document.getElementById("username").value="";
            document.getElementById("email").value="";
            document.getElementById("password").value="";
            document.getElementById("cpassword").value="";
        }
    </script>
</body>
</html>
